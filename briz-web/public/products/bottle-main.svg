<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1a3a"/>
      <stop offset="20%" stop-color="#163268"/>
      <stop offset="42%" stop-color="#2d5bb8"/>
      <stop offset="60%" stop-color="#467ae4"/>
      <stop offset="72%" stop-color="#22458a"/>
      <stop offset="100%" stop-color="#0d1f44"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.28)"/>
      <stop offset="50%" stop-color="rgba(15, 23, 42, 0.12)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Soft Ground Shadow -->
  <ellipse cx="400" cy="710" rx="170" ry="24" fill="url(#shadowGrad)"/>

  <!-- Bottle Group with shadow -->
  <g filter="url(#softGlow)">
    <!-- Carry Loop Handle on Cap -->
    <path d="M370 120 C370 70, 430 70, 430 120" stroke="url(#capGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M370 120 C370 85, 430 85, 430 120" stroke="url(#metalRing)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Screw-top Cap Main Block -->
    <rect x="352" y="118" width="96" height="52" rx="10" fill="url(#capGrad)"/>
    <!-- Textured Grip Ribs on Cap -->
    <line x1="368" y1="126" x2="368" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="380" y1="126" x2="380" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="392" y1="126" x2="392" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="408" y1="126" x2="408" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="126" x2="420" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="432" y1="126" x2="432" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Stainless Steel Collar Ring -->
    <rect x="350" y="170" width="100" height="12" rx="3" fill="url(#metalRing)"/>

    <!-- Bottle Neck Taper -->
    <path d="M354 182 L446 182 L484 250 L316 250 Z" fill="url(#bodyGrad)"/>
    <!-- Specular Highlight on Neck -->
    <path d="M394 182 L414 182 L430 250 L410 250 Z" fill="#ffffff" opacity="0.18"/>

    <!-- Main Cylindrical Body (750 ml profile) -->
    <rect x="316" y="248" width="168" height="420" rx="6" fill="url(#bodyGrad)"/>

    <!-- Vertical Specular Light Reflections -->
    <rect x="394" y="250" width="22" height="418" fill="#ffffff" opacity="0.22"/>
    <rect x="424" y="250" width="8" height="418" fill="#ffffff" opacity="0.15"/>
    <rect x="330" y="250" width="6" height="418" fill="#ffffff" opacity="0.08"/>

    <!-- Subtle Brand Mark / 750ml Iconography -->
    <g opacity="0.3" transform="translate(382, 450)">
      <circle cx="18" cy="18" r="16" stroke="#ffffff" stroke-width="2" fill="none"/>
      <path d="M12 18 L18 12 L24 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="13" x2="18" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="400" y="500" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff" opacity="0.38" text-anchor="middle" letter-spacing="3">BRIZ 750 ML</text>
    <text x="400" y="516" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#ffffff" opacity="0.25" text-anchor="middle" letter-spacing="1">DOUBLE WALL VACUUM</text>

    <!-- Bottom Stainless Steel Accent Base Ring -->
    <path d="M316 664 L484 664 L484 686 C484 694, 474 700, 464 700 L336 700 C326 700, 316 694, 316 686 Z" fill="url(#metalRing)"/>
  </g>
</svg>

